[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "log-parser-toolkit"
version = "0.2.0"
description = "A command-line utility to parse various log formats into JSON or CSV."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Liam", email = "carvajalperezliam7@gmail.com"}
]
dependencies = [
    "rich>=13.7.0"
]

[project.scripts]
log-parser = "log_parser_toolkit.cli:main"

[project.optional-dependencies]
geoip = ["geoip2>=4.8.0"]
sigma = ["PyYAML>=6.0"]
test = ["pytest>=7.0.0", "PyYAML>=6.0"]

[tool.setuptools.packages.find]
include = ["log_parser_toolkit*"]

[tool.pytest.ini_options]
# Prevent system-level pytest plugins (e.g. ROS ament/launch_testing) from
# interfering with the test run when installed in the same Python environment.
addopts = "-p no:launch_testing -p no:ament_copyright -p no:ament_flake8 -p no:ament_lint -p no:ament_pep257 -p no:ament_xmllint"
